<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lịch sử Bật Tắt - IoT Monitor</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">
<header class="topbar" id="topbar"></header>
<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Lịch sử Bật Tắt</h1>
      <p class="page-subtitle" id="todayLabel"></p>
    </div>
    <span class="conn-badge" id="connBadge"></span>
  </div>

  <div class="card filter-card">
    <div class="filter-field">
      <label for="deviceFilter">Thiết bị</label>
      <select id="deviceFilter">
        <option value="">Tất cả thiết bị</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="actionFilter">Lệnh thao tác</label>
      <select id="actionFilter">
        <option value="">Tất cả lệnh</option>
        <option value="ON">ON</option>
        <option value="OFF">OFF</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="resultFilter">Trạng thái</label>
      <select id="resultFilter">
        <option value="">Tất cả trạng thái</option>
        <option value="pending">PENDING</option>
        <option value="ok">SUCCESS</option>
        <option value="fail">FAILED</option>
        <option value="timeout">TIMEOUT</option>
      </select>
    </div>
    <div class="filter-field filter-field-wide">
      <label for="timeFilter">Thời gian</label>
      <input type="text" id="timeFilter" placeholder="VD: 26/08/2026, 22:52 hoặc 26/08/2026 22:52" />
    </div>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="searchBtn"><span>Tìm kiếm</span></button>
      <button type="button" class="btn btn-outline" id="resetBtn">Đặt lại</button>
    </div>
  </div>

  <div class="card">
    <div class="table-title">
      <div style="font-weight:700;font-size:15px">Lịch sử Bật Tắt</div>
      <p class="page-subtitle" style="margin:2px 0 16px">Nhật ký thao tác bật/tắt các thiết bị (theo dõi PENDING / SUCCESS / FAILED / TIMEOUT)</p>
    </div>

    <div id="tableWrap"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

<script src="/js/icons.js"></script>
<script src="/js/mock.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('history');
document.getElementById('todayLabel').textContent = todayLabel();
document.getElementById('searchBtn').insertAdjacentHTML('afterbegin', Icons.search);

const PAGE_SIZE_KEY = 'historyPageSize';
function savePageSize(n) { try { localStorage.setItem(PAGE_SIZE_KEY, String(n)); } catch {} }
function loadPageSize() {
  try { const n = Number(localStorage.getItem(PAGE_SIZE_KEY)); return PAGE_SIZE_OPTIONS.includes(n) ? n : 8; } catch { return 8; }
}
const state = { page: 1, size: loadPageSize(), device: '', action: '', result: '', time: '', sort: 'time_desc' };

function buildQuery() {
  const p = new URLSearchParams();
  p.set('page', state.page);
  p.set('size', state.size);
  p.set('sort', state.sort);
  if (state.device) p.set('device', state.device);
  if (state.action) p.set('action', state.action);
  if (state.result) p.set('result', state.result);
  if (state.time) p.set('time', state.time);
  return p.toString();
}

async function loadDeviceOptions() {
  try {
    const data = await Api.get('/api/devices');
    const sel = document.getElementById('deviceFilter');
    data.items.forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d.device_key;
      opt.textContent = d.device_name;
      sel.appendChild(opt);
    });
  } catch {
    // bo qua neu khong tai duoc danh sach thiet bi
  }
}

function renderTable(items) {
  const wrap = document.getElementById('tableWrap');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty-state">Chưa có lịch sử hoạt động.</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Tên thiết bị</th>
          <th>Người thao tác</th>
          <th>Lệnh thao tác</th>
          <th>Trạng thái thực thi</th>
          <th class="sortable" data-sort="time">Thời gian</th>
        </tr>
      </thead>
      <tbody>
        ${items
          .map(
            (it) => `
          <tr>
            <td class="mono-id">${formatId(it.id)}</td>
            <td>
              <div style="font-weight:700">${escapeHtml(it.device_name)}</div>
              <div class="note-cell">${escapeHtml(it.target)}</div>
            </td>
            <td>${escapeHtml(it.issued_by || '—')}</td>
            <td><span class="badge ${it.action === 'ON' ? 'on' : 'off'}">${escapeHtml(it.action)}</span></td>
            <td>
              <span class="badge ${it.result}">${resultBadgeLabel(it.result)}</span>
              ${it.note ? `<div class="note-cell">${escapeHtml(it.note)}</div>` : ''}
            </td>
            <td>${formatTime(it.time)}</td>
          </tr>`
          )
          .join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('th.sortable').forEach((th) => {
    th.addEventListener('click', () => {
      state.sort = state.sort === 'time_desc' ? 'time_asc' : 'time_desc';
      state.page = 1;
      load();
    });
  });
}

async function load() {
  try {
    const data = await Api.get(`/api/device-actions?${buildQuery()}`);
    renderTable(data.items);
    renderPager(
      document.getElementById('pagination'),
      data,
      (p) => { state.page = p; load(); },
      (n) => { state.size = n; state.page = 1; savePageSize(n); load(); }
    );
    setConnection(true);
  } catch (err) {
    document.getElementById('tableWrap').innerHTML = `<div class="error-state">Không thể tải lịch sử hoạt động. Vui lòng thử lại sau. (${err.message})</div>`;
    document.getElementById('pagination').innerHTML = '';
    setConnection(false);
  }
}

// ===== Bo loc: chi ap dung khi bam "Tim kiem" (hoac Enter), "Dat lai" de xoa =====
function applyFilters() {
  state.device = document.getElementById('deviceFilter').value;
  state.action = document.getElementById('actionFilter').value;
  state.result = document.getElementById('resultFilter').value;
  // Chuan hoa: "26/08/2026 - 22:52" -> "26/08/2026 22:52", bo khoang trang thua
  state.time = document.getElementById('timeFilter').value.trim().replace(/\s*-\s*(?=\d{1,2}:)/, ' ').replace(/\s+/g, ' ');
  state.page = 1;
  load();
}
function resetFilters() {
  ['deviceFilter', 'actionFilter', 'resultFilter', 'timeFilter'].forEach((id) => { document.getElementById(id).value = ''; });
  Object.assign(state, { device: '', action: '', result: '', time: '', page: 1 });
  load();
}
document.getElementById('searchBtn').addEventListener('click', applyFilters);
document.getElementById('resetBtn').addEventListener('click', resetFilters);
document.querySelectorAll('.filter-card input').forEach((el) =>
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilters(); })
);

loadDeviceOptions();
load();
</script>
</body>
</html>
