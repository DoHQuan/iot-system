<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập - IoT Monitor</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-logo" id="loginLogo"></div>
    <h1>Đăng nhập</h1>
    <p>Hệ thống giám sát &amp; điều khiển thiết bị IoT (ESP8266)</p>
    <div class="form-error" id="formError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
    </form>
    <div class="hint">Tài khoản mặc định: <strong>admin</strong> / <strong>admin123</strong></div>
  </div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script>
  document.getElementById('loginLogo').innerHTML = Icons.home;

  if (Api.getToken()) window.location.href = '/index.html';

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('formError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.textContent = '';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const res = await Api.login(username, password);
      Api.setSession(res.token, res.user);
      window.location.href = '/index.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Đăng nhập thất bại';
    }
  });
</script>
</body>
</html>
