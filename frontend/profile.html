<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hồ sơ - IoT Monitor</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">
<header class="topbar" id="topbar"></header>
<main class="main" style="max-width:640px">
  <div class="page-header">
    <div>
      <h1 class="page-title">Hồ sơ</h1>
      <p class="page-subtitle">Thông tin tài khoản đang đăng nhập.</p>
    </div>
  </div>

  <div class="card">
    <div class="profile-row">
      <div class="profile-label">Tên đăng nhập</div>
      <div class="profile-value" id="pUsername"></div>
    </div>
    <div class="profile-row">
      <div class="profile-label">Họ tên</div>
      <div class="profile-value" id="pFullName"></div>
    </div>
    <div class="profile-row">
      <div class="profile-label">Vai trò</div>
      <div class="profile-value" id="pRole"></div>
    </div>
    <div class="profile-row">
      <div class="profile-label">Figma</div>
      <div class="profile-value" id="pFigma"></div>
    </div>
    <div class="profile-row">
      <div class="profile-label">GitHub</div>
      <div class="profile-value" id="pGithub"></div>
    </div>
    <div class="profile-row">
      <div class="profile-label">Postman</div>
      <div class="profile-value" id="pPostman"></div>
    </div>
  </div>

  <div style="margin-top:16px">
    <button class="btn btn-outline" id="logoutBtn2">Đăng xuất khỏi hệ thống</button>
  </div>
</main>

<script src="/js/icons.js"></script>
<script src="/js/mock.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('profile');
const user = Api.getUser() || {};
document.getElementById('pUsername').textContent = user.username || '—';
document.getElementById('pFullName').textContent = user.full_name || '—';
document.getElementById('pRole').textContent = user.role === 'admin' ? 'Quản trị viên (admin)' : 'Người dùng';

// ===== Liên kết dự án: sửa URL tại đây =====
const PROJECT_LINKS = {
  figma:   'https://www.figma.com/design/mRrzqBD6rDk1yqhPoVbEPU/Quan-IOT?node-id=0-1&t=PUuKuhhPTMDHHB9Z-0',
  github:  'https://github.com/DoHQuan/iot-system',
  postman: '' // dán link Postman (collection/documentation) vào đây
};
const LINK_ICONS = {
  figma: '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="#F24E1E" d="M8 2h4v6.5H8a3.25 3.25 0 0 1 0-6.5z"/><path fill="#FF7262" d="M12 2h4a3.25 3.25 0 0 1 0 6.5h-4z"/><path fill="#A259FF" d="M8 8.5h4V15H8a3.25 3.25 0 0 1 0-6.5z"/><circle fill="#1ABCFE" cx="16" cy="11.75" r="3.25"/><path fill="#0ACF83" d="M8 15h4v3.25A3.25 3.25 0 1 1 8 15z"/></svg>',
  github: '<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4 18.3 4.3 18.3 4.3c.7 1.6.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>',
  postman: '<svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="12" fill="#FF6C37"/><path fill="#fff" d="M15.6 6.2 9.4 12.4l1.2 1.2 6.2-6.2a.85.85 0 0 0-1.2-1.2zM8.6 13.2l-1.9 3.4c-.1.2.1.4.3.3l3.4-1.9z"/></svg>'
};
const EXT_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>';
function renderLink(id, key, label) {
  const el = document.getElementById(id);
  const url = PROJECT_LINKS[key];
  if (!url) {
    el.innerHTML = `<span class="profile-link muted">${LINK_ICONS[key]}<span>Chưa cập nhật</span></span>`;
    return;
  }
  el.innerHTML = `<a class="profile-link" href="${url}" target="_blank" rel="noopener noreferrer" title="${url}">${LINK_ICONS[key]}<span>${label}</span>${EXT_ICON}</a>`;
}
renderLink('pFigma', 'figma', 'Xem bản thiết kế trên Figma');
renderLink('pGithub', 'github', 'Xem mã nguồn trên GitHub');
renderLink('pPostman', 'postman', 'Xem tài liệu API trên Postman');
document.getElementById('logoutBtn2').addEventListener('click', () => {
  Api.clearSession();
  window.location.href = '/login.html';
});
</script>
</body>
</html>
