<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lịch sử Cảm biến - IoT Monitor</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page">
<header class="topbar" id="topbar"></header>
<main class="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Lịch sử Cảm biến</h1>
      <p class="page-subtitle" id="todayLabel"></p>
    </div>
    <span class="conn-badge" id="connBadge"></span>
  </div>

  <div class="card filter-card">
    <div class="filter-field">
      <label for="typeFilter">Loại cảm biến</label>
      <select id="typeFilter">
        <option value="">Tất cả cảm biến</option>
        <option value="temperature">Nhiệt độ</option>
        <option value="humidity">Độ ẩm</option>
        <option value="light">Ánh sáng</option>
        <option value="random_10">Cảm biến 1 (0-10)</option>
        <option value="random_100">Cảm biến 2 (0-100)</option>
        <option value="random_1000">Cảm biến 3 (0-1000)</option>
        <option value="time">Thời gian</option>
      </select>
    </div>
    <div class="filter-field filter-field-wide">
      <label for="valueFilter">Giá trị</label>
      <input type="text" id="valueFilter" placeholder="VD: 25.5, >30, Nhiệt độ >30" />
    </div>
    <div class="filter-actions">
      <button type="button" class="btn btn-primary" id="searchBtn"><span>Tìm kiếm</span></button>
      <button type="button" class="btn btn-outline" id="resetBtn">Đặt lại</button>
    </div>
  </div>

  <div class="card">
    <div class="table-title">
      <div style="font-weight:700;font-size:15px">Lịch sử Cảm biến</div>
      <p class="page-subtitle" style="margin:2px 0 16px">Dữ liệu đọc từ các cảm biến nhiệt độ, độ ẩm, ánh sáng và 3 cảm biến ngẫu nhiên</p>
    </div>

    <div id="tableWrap"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</main>

<script src="/js/icons.js"></script>
<script src="/js/mock.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
renderLayout('sensor-data');
document.getElementById('todayLabel').textContent = todayLabel();
document.getElementById('searchBtn').insertAdjacentHTML('afterbegin', Icons.search);

const PAGE_SIZE_KEY = 'sensorPageSize';
function savePageSize(n) { try { localStorage.setItem(PAGE_SIZE_KEY, String(n)); } catch {} }
function loadPageSize() {
  try { const n = Number(localStorage.getItem(PAGE_SIZE_KEY)); return PAGE_SIZE_OPTIONS.includes(n) ? n : 8; } catch { return 8; }
}
const state = { page: 1, size: loadPageSize(), type: '', value: '', search: '', time: '', sort: 'time_desc' };

function buildQuery() {
  const p = new URLSearchParams();
  p.set('page', state.page);
  p.set('size', state.size);
  p.set('sort', state.sort);
  if (state.type) p.set('type', state.type);
  if (state.value) p.set('value', state.value);
  if (state.search) p.set('search', state.search);
  if (state.time) p.set('time', state.time);
  return p.toString();
}

const VALUE_PLACEHOLDER = {
  '': 'VD: 25.5, >30, Nhiệt độ >30',
  time: 'VD: 26/08/2026, 22:52 hoặc 26/08/2026 22:52',
};
function syncValuePlaceholder() {
  const type = document.getElementById('typeFilter').value;
  document.getElementById('valueFilter').placeholder = VALUE_PLACEHOLDER[type] || VALUE_PLACEHOLDER[''];
}

const VALUE_CLASS = { temperature: 'value-temp', humidity: 'value-humidity', light: 'value-light' };

function renderTable(items) {
  const wrap = document.getElementById('tableWrap');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty-state">Không có dữ liệu cảm biến phù hợp.</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Tên cảm biến</th>
          <th class="sortable" data-sort="value">Giá trị đo</th>
          <th class="sortable" data-sort="time">Thời gian thu thập</th>
        </tr>
      </thead>
      <tbody>
        ${items
          .map(
            (it) => `
          <tr>
            <td class="mono-id">${formatId(it.id)}</td>
            <td>${escapeHtml(it.sensor_name)} <span class="note-cell">${escapeHtml(it.device_name)}</span></td>
            <td class="${VALUE_CLASS[it.sensor_type] || ''}">${it.value}${it.unit ? ' ' + escapeHtml(it.unit) : ''}</td>
            <td>${formatTime(it.time)}</td>
          </tr>`
          )
          .join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('th.sortable').forEach((th) => {
    th.addEventListener('click', () => {
      const base = th.dataset.sort;
      state.sort = state.sort === `${base}_desc` ? `${base}_asc` : `${base}_desc`;
      state.page = 1;
      load();
    });
  });
}

async function load() {
  try {
    const data = await Api.get(`/api/sensor-data?${buildQuery()}`);
    renderTable(data.items);
    renderPager(
      document.getElementById('pagination'),
      data,
      (p) => { state.page = p; load(); },
      (n) => { state.size = n; state.page = 1; savePageSize(n); load(); }
    );
    setConnection(true);
  } catch (err) {
    document.getElementById('tableWrap').innerHTML = `<div class="error-state">Không thể tải dữ liệu cảm biến. Vui lòng thử lại sau. (${err.message})</div>`;
    document.getElementById('pagination').innerHTML = '';
    setConnection(false);
  }
}

// ===== Bo loc: chi ap dung khi bam "Tim kiem" (hoac Enter), "Dat lai" de xoa =====
function applyFilters() {
  const type = document.getElementById('typeFilter').value;
  const raw = document.getElementById('valueFilter').value.trim();
  if (type === 'time') {
    // Chon loai "Thoi gian" -> o Gia tri dung de nhap dieu kien thoi gian
    state.type = '';
    state.value = '';
    state.search = '';
    // Chuan hoa: "26/08/2026 - 22:52" -> "26/08/2026 22:52", bo khoang trang thua
    state.time = raw.replace(/\s*-\s*(?=\d{1,2}:)/, ' ').replace(/\s+/g, ' ');
  } else {
    // Tach o gia tri thanh 2 phan: chu (ten cam bien) + dieu kien so o cuoi (25.5, >30, <=20...)
    const m = raw.match(/(?:^|\s)((?:>=|<=|>|<|=)?\s*-?\d+(?:[.,]\d+)?)$/);
    state.type = type;
    state.value = m ? m[1].replace(/\s+/g, '').replace(',', '.') : '';
    state.search = (m ? raw.slice(0, raw.length - m[0].length) : raw).trim();
    state.time = '';
  }
  state.page = 1;
  load();
}
function resetFilters() {
  ['typeFilter', 'valueFilter'].forEach((id) => { document.getElementById(id).value = ''; });
  Object.assign(state, { type: '', value: '', search: '', time: '', page: 1 });
  syncValuePlaceholder();
  load();
}
document.getElementById('searchBtn').addEventListener('click', applyFilters);
document.getElementById('resetBtn').addEventListener('click', resetFilters);
document.getElementById('typeFilter').addEventListener('change', syncValuePlaceholder);
document.querySelectorAll('.filter-card input').forEach((el) =>
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyFilters(); })
);

load();
</script>
</body>
</html>
