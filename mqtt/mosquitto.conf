# ======================================================
# Cau hinh Mosquitto RIENG cho du an iot-system
# Chay bang: mosquitto -c D:\iot-system\mqtt\mosquitto.conf -v
# (khong dung chung voi service Mosquitto mac dinh o cong 1883)
# ======================================================

# Nghe o cong 8888 tren MOI card mang (0.0.0.0) de ca Backend (localhost)
# va ESP8266 (qua WiFi) deu ket noi duoc. Phai khop MQTT_PORT trong backend/.env
# va MQTT_PORT trong file .ino.
listener 8888 0.0.0.0

# Bat buoc dang nhap bang tai khoan (khong cho ket noi an danh)
allow_anonymous false
password_file D:/iot-system/mqtt/passwd

# Khong luu trang thai ra dia cho gon (du an khong can retain lau dai)
persistence false
